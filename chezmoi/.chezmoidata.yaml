# 共通工具清單。宣告與執行分離:這裡只宣告「裝什麼」,
# 安裝腳本(run_*)負責「怎麼裝」,並處理各平台套件名差異。

packages:
  # bootstrap 的前置工具,需 root(apt)才能裝。
  # git(clone 專案)與 curl(抓 chezmoi/mise)實務上必然已存在——沒有它們根本跑不到這步——
  # 故本層對 vm/workstation 是 no-op,留著僅為 container(極簡 image 可能真的缺)的安全網。
  # 其餘現代 CLI 一律改由 mise 提供,讓「非 root 且無 sudo」的使用者也能裝齊(安裝腳本會 fail-loud 跳過本層)。
  system:
    - { brew: git,  apt: git }
    - { brew: curl, apt: curl }

  # Debian 11 的 apt 沒有(或版本過舊)的現代 CLI / runtime,
  # 改用 mise 跨平台安裝預編譯 binary,確保各環境版本一致。
  # 分層:common 給所有非 container(vm + workstation);workstation 僅 mac 額外加裝。
  mise:
    # 所有非 container(vm + workstation):runtime + 既有現代 CLI
    common:
      - eza
      - bat          # 移自 system:apt(Debian 需 root,執行檔名 batcat);mise 裝的直接叫 bat
      - fd           # 移自 system:apt(Debian 需 root,執行檔名 fdfind);mise 裝的直接叫 fd
      - ripgrep      # 移自 system:apt,改由 mise 免 root
      - jq           # 移自 system:apt,改由 mise 免 root
      - zoxide
      - fzf          # 移自 system:apt(bullseye)的 fzf 0.24 太舊,缺 zoxide 互動選單要的新選項
      - delta
      - jless
      - node@lts
      - go
      - uv
      # rust:mise 委派 rustup;mac 現以獨立 rustup 安裝(zsh/.zshrc L151-152)。
      #       暫不納入,避免與 rustup 雙頭;待 mac 編排移交時再決定。
    # 僅 workstation(mac):從 Brewfile 遷入的開發向 CLI(aqua/ubi backend,高信心)
    # 註:gh/lazygit/btop/direnv 在 vm 也好用,先放這維持 vm 精簡;要在 vm 用就移到 common。
    workstation:
      - neovim
      - helix
      - zellij
      - tree-sitter
      - ast-grep
      - typos-cli
      - glab
      - fastfetch
      - lazygit
      - lazydocker
      - btop
      - direnv
      - gh
